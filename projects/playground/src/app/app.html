<main>
  <h1>ngx-mira-charts · playground</h1>

  <button type="button" (click)="randomize()">Randomize data</button>
  <button type="button" (click)="showPv.set(!showPv())">
    pv: {{ showPv() ? 'on' : 'off' }}
  </button>

  <mira-line-chart [data]="data()" [width]="640" [height]="320">
    <mira-x-axis dataKey="name" />
    <mira-y-axis />
    <mira-line dataKey="uv" stroke="#8884d8" />
    @if (showPv()) {
      <mira-line dataKey="pv" stroke="#82ca9d" />
    }
  </mira-line-chart>
</main>
