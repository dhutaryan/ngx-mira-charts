<main>
  <h1>ngx-mira-charts · playground</h1>

  <button type="button" (click)="randomize()">Randomize data</button>
  <button type="button" (click)="showPv.set(!showPv())">
    pv: {{ showPv() ? 'on' : 'off' }}
  </button>
  <button type="button" (click)="dots.set(!dots())">
    dots: {{ dots() ? 'on' : 'off' }}
  </button>
  <button type="button" (click)="gaps.set(!gaps())">
    gaps: {{ gaps() ? 'on' : 'off' }}
  </button>
  <button
    type="button"
    (click)="curve.set(curve() === 'linear' ? 'monotone' : 'linear')"
  >
    curve: {{ curve() }}
  </button>
  <button type="button" (click)="dark.set(!dark())">
    theme: {{ dark() ? 'dark' : 'light' }}
  </button>

  <mira-line-chart [data]="data()">
    <mira-cartesian-grid strokeDasharray="3 3" />
    <mira-x-axis dataKey="name" />
    <mira-y-axis />
    <mira-line dataKey="uv" stroke="#8884d8" [curve]="curve()" [dot]="dots()" />
    @if (showPv()) {
      <mira-line
        dataKey="pv"
        stroke="#82ca9d"
        [curve]="curve()"
        [dot]="dots()"
      />
    }
    <app-average-line dataKey="uv" />
  </mira-line-chart>
</main>
