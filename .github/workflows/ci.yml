name: CI

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Before Node.js: its pnpm cache needs pnpm on the path. The version
      # comes from the packageManager field of package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # No specs yet: a Test step comes with them (#14).
      - name: Build library
        run: pnpm build:lib

      # The playground imports the library from dist, as an app imports the
      # package, so this catches a change that breaks an app's build.
      - name: Build playground
        run: pnpm ng build playground
